version: "3.9"

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: evaluador-judge0-server
    privileged: true
    restart: unless-stopped
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks:
      - judge0-net

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: evaluador-judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
    networks:
      - judge0-net

  judge0-db:
    image: postgres:16-alpine
    container_name: evaluador-judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0_password_dev
      POSTGRES_DB: judge0
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net

  judge0-redis:
    image: redis:7-alpine
    container_name: evaluador-judge0-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net

volumes:
  judge0_db_data:
  judge0_redis_data:

networks:
  judge0-net:
    driver: bridge
