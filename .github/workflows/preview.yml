name: Frontend Preview & Quality Gate

on:
  push:
    branches:
      - develop
      - main
      - dev_frontend
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/preview.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/preview.yml"

jobs:
  validate-frontend:
    name: Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @evaluador/web lint

      - name: Run TypeScript typecheck
        run: pnpm --filter @evaluador/web typecheck

      - name: Run Unit Tests
        run: pnpm --filter @evaluador/web test

      - name: Build Next.js application
        run: pnpm --filter @evaluador/web build
        env:
          NEXT_PUBLIC_ENABLE_MOCKS: "true"
          NEXT_TELEMETRY_DISABLED: "1"
